# =============================================================================
# default.conf — Configuration Nginx pour PHP-FPM
# =============================================================================
# À placer sur le NFS : /mnt/nfs/swarm/nginx/default.conf
# (depuis swarm-nfs : sudo nano /srv/nfs/swarm/nginx/default.conf)
# =============================================================================

server {
    listen 80;
    root /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
